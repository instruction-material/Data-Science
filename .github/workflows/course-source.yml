name: Course source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install the complete locked runtime and audit-tool graph
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip check
          python -c "import matplotlib; print(matplotlib.__version__)"
      - name: Audit runtime and complete development dependencies
        run: |
          mkdir -p evidence
          python -m pip_audit --strict --require-hashes --disable-pip -r requirements.txt --format json --output evidence/runtime-audit.json
          python -m pip_audit --strict --require-hashes --disable-pip -r requirements-ci.txt --format json --output evidence/full-audit.json
      - name: Verify source layout and all native contracts
        run: bash verify-course-source.sh
      - name: Retain the native chart outputs for independent review
        run: python -B tests/export_chart_evidence.py
      - name: Retain dashboard and capstone entrypoints and original CSV output
        run: python -B tests/export_dashboard_evidence.py
      - name: Retain fresh reproducibility entrypoints and exact report bytes
        run: python -B tests/export_reproducibility_evidence.py
      - name: Retain all six tabular examples and source digests
        run: python -B tests/export_tabular_evidence.py
      - name: Retain the original audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-source-audits
          path: evidence/
          if-no-files-found: error
